<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Varela Round">
    <link rel="stylesheet" href="adminCSS.css">
    <script src="https://kit.fontawesome.com/116f25b7f7.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.1.1.js"></script>
</head>
<body>
    <div id="topheader">
        <h1 id="title">Admin <span>Dashboard</span></h1>
    </div>
    <div class="form-container">
        <form id="item-form">
            <label for="item-title">Item Title:</label>
            <input type="text" id="item-title" required><br>

            <label for="item-price">Item Price:</label>
            <input type="number" id="item-price" required  max="999999" min="0"><br>

            <label for="item-category">Item Category:</label>
            <select id="item-category" required>
                <option value="Weapons">Weapons</option>
                <option value="Armor">Armor</option>
                <option value="Potions">Potions</option>
            </select><br>

            <label for="item-image">Item Image URL:</label>
            <input type="text" id="item-image" required><br>

            <button type="submit" id="add-item-btn">Add Item</button>
        </form>
    </div>
    <h2>Items List</h2>
    <div class="item-list-container">
        <div id="item-list"></div>

    </div>

    <div class="link-container">
        <a href="store.html">Go to Store</a>
    </div>
    <script src="adminJS.js"></script>
</body>
</html>
